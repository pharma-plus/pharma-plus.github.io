services:
  - type: web
    name: pharma-plus-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node scripts/start-prod.mjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharma-plus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: LOCKOUT_MINUTES
        value: 15
      - key: SESSION_INACTIVITY_MINUTES
        value: 120
      - key: OTP_ISSUER
        value: "Pharma Plus"
      - key: STORAGE_DRIVER
        value: local
      - key: CORS_ORIGINS
        value: "https://pharma-plus.github.io"
      - key: SUPER_ADMIN_EMAIL
        value: "admin@pharmaplus.com"
      - key: SUPER_ADMIN_PASSWORD
        value: "SuperAdmin_2026!"

databases:
  - name: pharma-plus-db
    plan: free
    databaseName: pharma_plus
    user: pharma_plus
