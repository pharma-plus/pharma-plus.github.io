services:
  - type: web
    name: pharma-plus-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node scripts/start-prod.mjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharma-plus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: LOCKOUT_MINUTES
        value: 15
      - key: SESSION_INACTIVITY_MINUTES
        value: 120
      - key: OTP_ISSUER
        value: "Pharma Plus"
      - key: STORAGE_DRIVER
        value: local
      - key: CORS_ORIGINS
        value: "https://pharma-plus.github.io"
      # Secrets : valeurs définies dans le dashboard Render (jamais dans Git).
      # BACKUP_ENCRYPTION_KEY est OBLIGATOIRE au démarrage (config refuse de
      # démarrer sans clé — aucune valeur par défaut, prompt sécurité §4).
      # Utiliser la MÊME valeur que le secret GitHub BACKUP_ENCRYPTION_KEY.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      # SUPER_ADMIN_EMAIL/PASSWORD supprimés : plus aucune valeur de secours,
      # plus aucun consommateur backend (création superadmin retirée du seed).

databases:
  - name: pharma-plus-db
    plan: free
    databaseName: pharma_plus
    user: pharma_plus
