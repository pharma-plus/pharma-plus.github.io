<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PHARMA+ — Suite de gestion de pharmacie (caisse, stock, ordonnances, parapharmacie, IA).">
  <meta name="theme-color" content="#1B5E20">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PHARMA+">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>PHARMA+ — Gestion de pharmacie</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --green-1: #061e12;
      --green-2: #0a2f1d;
      --green-3: #0d4530;
      --green-4: #0fee8b;
      --green-5: #9ef7c9;
      --gold: #d8bf7a;
      --text: #e9fff7;
      --muted: rgba(255,255,255,0.75);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #020b09;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 40%, rgba(34, 108, 78, 0.28), transparent 32%),
        linear-gradient(180deg, rgba(2,11,9,0.95), rgba(2,13,11,0.96));
    }

    #pmg-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(180deg, rgba(1, 11, 10, 0.92), rgba(0, 9, 7, 0.96)),
        linear-gradient(90deg, rgba(12, 52, 37, 0.5), rgba(0, 0, 0, 0.2), rgba(8, 39, 30, 0.5));
      padding: 24px;
    }

    #pmg-loading::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.15) 0%, rgba(25, 147, 98, 0.06) 28%, rgba(0,0,0,0.15) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(0,255,170,0.07) 0 2px,
          transparent 2px 38px
        );
      opacity: 0.7;
      pointer-events: none;
    }

    .pmg-loader-shell {
      position: relative;
      width: min(1400px, 94vw);
      height: min(760px, 84vh);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(2, 19, 15, 0.82), rgba(7, 17, 14, 0.9)),
        radial-gradient(circle at center, rgba(27, 157, 103, 0.15), transparent 42%);
      border: 1px solid rgba(148, 218, 180, 0.18);
      box-shadow: 0 0 40px rgba(15, 209, 128, 0.16), inset 0 0 30px rgba(11, 64, 48, 0.22);
      overflow: hidden;
    }

    .pmg-loader-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.2) 0 14%, rgba(255,255,255,0.03) 14% 18%, rgba(0,0,0,0.15) 18% 34%, rgba(255,255,255,0.02) 34% 38%, rgba(0,0,0,0.1) 38% 58%, rgba(255,255,255,0.03) 58% 62%, rgba(0,0,0,0.2) 62% 100%);
      opacity: 0.8;
    }

    .pmg-pharmacy-scene {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.08)),
        linear-gradient(90deg,
          rgba(10,36,26,0.85) 0 26%,
          rgba(0,0,0,0.18) 26% 34%,
          rgba(9,31,24,0.8) 34% 66%,
          rgba(0,0,0,0.18) 66% 74%,
          rgba(10,36,26,0.85) 74% 100%);
    }

    .pmg-shelf {
      position: absolute;
      bottom: 110px;
      width: 16%;
      height: 52%;
      background: linear-gradient(180deg, rgba(37, 72, 58, 0.8), rgba(11, 25, 22, 0.9));
      border: 1px solid rgba(131, 220, 170, 0.17);
      box-shadow: inset 0 0 20px rgba(115, 237, 166, 0.12);
    }

    .pmg-shelf.left { left: 2%; }
    .pmg-shelf.right { right: 2%; }

    .pmg-shelf::before,
    .pmg-shelf::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 8px;
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 0 1px rgba(135, 255, 195, 0.06);
    }

    .pmg-shelf::before { top: 28%; }
    .pmg-shelf::after { top: 62%; }

    .pmg-shelf .pmg-box {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 12%;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(188, 255, 218, 0.46), rgba(75, 121, 132, 0.28));
      box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
      border: 1px solid rgba(169, 255, 210, 0.18);
    }

    .pmg-shelf.left .pmg-box:nth-child(1) { top: 8%; }
    .pmg-shelf.left .pmg-box:nth-child(2) { top: 23%; }
    .pmg-shelf.left .pmg-box:nth-child(3) { top: 38%; }
    .pmg-shelf.left .pmg-box:nth-child(4) { top: 53%; }
    .pmg-shelf.right .pmg-box:nth-child(1) { top: 8%; }
    .pmg-shelf.right .pmg-box:nth-child(2) { top: 23%; }
    .pmg-shelf.right .pmg-box:nth-child(3) { top: 38%; }
    .pmg-shelf.right .pmg-box:nth-child(4) { top: 53%; }

    .pmg-light-strip {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 28px;
      border-radius: 50% 50% 12px 12px / 100% 100% 100% 100%;
      background: rgba(24, 203, 132, 0.14);
      box-shadow: 0 0 28px rgba(28, 223, 137, 0.5);
      top: 48%;
    }

    .pmg-brand-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    .pmg-logo-badge {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(16, 74, 52, 0.88), rgba(9, 39, 28, 0.9));
      border: 3px solid rgba(200, 255, 220, 0.8);
      box-shadow: 0 0 0 12px rgba(20, 72, 52, 0.6), 0 0 34px rgba(21, 255, 159, 0.44);
      margin-top: 8px;
    }

    .pmg-logo-badge::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 2px solid rgba(111, 234, 168, 0.5);
      box-shadow: inset 0 0 20px rgba(90, 255, 170, 0.15);
    }

    .pmg-cross {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 18px;
      background: rgba(255,255,255,0.12);
      transform: rotate(0deg);
    }

    .pmg-cross::before,
    .pmg-cross::after {
      content: "";
      position: absolute;
      background: linear-gradient(180deg, #ffffff, #dfece7);
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(57, 255, 160, 0.2);
    }

    .pmg-cross::before {
      width: 30px;
      height: 110px;
      left: 60px;
      top: 20px;
    }

    .pmg-cross::after {
      width: 110px;
      height: 30px;
      left: 20px;
      top: 60px;
    }

    .pmg-leaf {
      position: absolute;
      width: 90px;
      height: 78px;
      right: 26px;
      top: 72px;
      background: linear-gradient(135deg, #69ffbc, #0ad970);
      border-radius: 65% 0 65% 0;
      transform: rotate(18deg);
      box-shadow: 0 0 18px rgba(48, 255, 164, 0.4);
    }

    .pmg-leaf::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 52px;
      left: 44px;
      top: 12px;
      background: rgba(6, 84, 40, 0.7);
      transform: rotate(18deg);
      border-radius: 2px;
    }

    .pmg-brand {
      margin-top: 18px;
      font-size: clamp(48px, 8vw, 130px);
      letter-spacing: -0.08em;
      font-weight: 900;
      color: #f2fff9;
      text-transform: uppercase;
      line-height: 0.88;
      text-shadow:
        0 0 24px rgba(58,255,180,0.35),
        0 10px 18px rgba(0,0,0,0.52);
      position: relative;
      z-index: 2;
    }

    .pmg-brand span {
      display: inline-block;
      vertical-align: middle;
      filter: drop-shadow(0 0 12px rgba(35, 255, 133, 0.4));
    }

    .pmg-subtitle {
      margin-top: 16px;
      font-size: clamp(14px, 1.7vw, 30px);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--green-5);
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      position: relative;
      z-index: 2;
    }

    .pmg-progress-box {
      width: min(640px, 70vw);
      margin-top: 32px;
      position: relative;
      z-index: 2;
    }

    .pmg-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--text);
      font-size: clamp(18px, 1.8vw, 28px);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .pmg-status span:last-child {
      color: #a6ffd4;
      font-weight: 800;
    }

    .pmg-progress {
      position: relative;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(111, 234, 168, 0.5);
      box-shadow: 0 0 16px rgba(92,255,181,0.25);
    }

    .pmg-progress > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 75%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22e68f, #7effb6, #0ee8a2);
      box-shadow: 0 0 18px rgba(53, 255, 160, 0.5);
    }

    .pmg-loading-text {
      margin-top: 14px;
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: clamp(14px, 1.3vw, 20px);
      position: relative;
      z-index: 2;
    }

    @keyframes pmg-spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .pmg-loader-shell {
        height: min(560px, 72vh);
      }
      .pmg-logo-badge { width: 180px; height: 180px; }
      .pmg-cross { width: 110px; height: 110px; }
      .pmg-cross::before { width: 24px; height: 82px; left: 43px; top: 14px; }
      .pmg-cross::after { width: 82px; height: 24px; left: 14px; top: 43px; }
      .pmg-leaf { width: 72px; height: 62px; right: 18px; top: 52px; }
      .pmg-subtitle { letter-spacing: 0.1em; }
      .pmg-progress-box { width: min(500px, 82vw); }
    }
  </style>
</head>
<body>
  <!-- Écran de chargement PHARMA+ (masqué une fois Flutter initialisé) -->
  <div id="pmg-loading">
    <div class="pmg-loader-shell">
      <div class="pmg-pharmacy-scene"></div>
      <div class="pmg-shelf left">
        <div class="pmg-box"></div>
        <div class="pmg-box"></div>
        <div class="pmg-box"></div>
        <div class="pmg-box"></div>
      </div>
      <div class="pmg-shelf right">
        <div class="pmg-box"></div>
        <div class="pmg-box"></div>
        <div class="pmg-box"></div>
        <div class="pmg-box"></div>
      </div>
      <div class="pmg-light-strip"></div>

      <div class="pmg-brand-wrap">
        <div class="pmg-logo-badge">
          <div class="pmg-cross"></div>
          <div class="pmg-leaf"></div>
        </div>
        <div class="pmg-brand"><span>PHARMA+</span></div>
        <div class="pmg-subtitle">GESTION INTELLIGENTE<br>DE VOTRE PHARMACIE</div>

        <div class="pmg-progress-box">
          <div class="pmg-status">
            <span>Bienvenue dans votre pharmacie</span>
            <span>75%</span>
          </div>
          <div class="pmg-progress"><span></span></div>
          <div class="pmg-loading-text">Chargement en cours...</div>
        </div>
      </div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=73d91f9" async></script>
  <script>
    // Supprime l'écran de chargement dès que le premier frame Flutter est rendu.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('pmg-loading');
      if (el) el.parentNode && el.parentNode.removeChild(el);
    });
    // Sécurité anti-blocage : retire le loader au bout de 15 s quoi qu'il
    // arrive, afin qu'il ne puisse jamais masquer l'application.
    setTimeout(function () {
      var el = document.getElementById('pmg-loading');
      if (el) el.parentNode && el.parentNode.removeChild(el);
    }, 15000);
  </script>
</body>
</html>
