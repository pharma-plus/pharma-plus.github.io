<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PHARMA+ — Suite de gestion de pharmacie (caisse, stock, ordonnances, parapharmacie, IA).">
  <meta name="theme-color" content="#03100D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PHARMA+">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>PHARMA+ — Gestion de pharmacie</title>
  <link rel="manifest" href="manifest.json">
  <!-- Préchargement des ressources visibles du splash (logo webp 262 Ko au lieu du png 1 Mo) -->
  <link rel="preload" as="image" href="assets/assets/branding/pharma-logo-full.webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/assets/images/background.webp">
  <style>
    html, body { margin: 0; padding: 0; background: #03100D; }
    /* ============================================================
       ÉCRAN DE CHARGEMENT PHARMA+ — conforme maquette :
       logo officiel complet + « Bienvenue » or + sous-titre +
       VRAIE barre de progression animée (HTML/CSS/JS, 0→100 %).
       La progression n'est PAS une image : elle évolue réellement.
       ============================================================ */
    #pmg-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0;
      background:
        linear-gradient(rgba(3, 16, 13, 0.66), rgba(3, 16, 13, 0.66)),
        url('assets/assets/images/background.webp') center / cover no-repeat,
        linear-gradient(150deg, #03100D 0%, #061A15 50%, #020B08 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
    }
    #pmg-loading .pmg-logo {
      width: min(58vw, 220px); height: auto;
      display: block; margin: 0 auto;
      animation: pmg-in 0.9s ease-out both;
    }
    #pmg-loading .pmg-welcome {
      margin-top: 18px;
      font-size: 26px; font-weight: 800;
      color: #E9C873;
      letter-spacing: 0.3px;
      animation: pmg-in 0.9s ease-out 0.15s both;
    }
    #pmg-loading .pmg-sub {
      margin-top: 6px;
      font-size: 12.5px; letter-spacing: 0.4px;
      color: #9BAEA7;
      animation: pmg-in 0.9s ease-out 0.25s both;
    }
    /* Barre de progression RÉELLE — jamais une image. */
    #pmg-loading .pmg-progress-row {
      margin-top: 26px;
      display: flex; align-items: center; gap: 12px;
      animation: pmg-in 0.9s ease-out 0.35s both;
    }
    #pmg-loading .pmg-track {
      width: min(60vw, 300px); height: 7px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(47, 181, 99, 0.45);
      overflow: hidden;
    }
    #pmg-loading .pmg-fill {
      width: 0%; height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, #1E8F4E, #43D97C);
      transition: width 0.35s ease-in-out;
    }
    #pmg-loading .pmg-pct {
      width: 44px; text-align: right;
      font-size: 13.5px; font-weight: 800;
      color: #43D97C; letter-spacing: 0.5px;
    }
    #pmg-loading .pmg-loadtext {
      margin-top: 14px;
      font-size: 12px; color: rgba(255, 255, 255, 0.42);
    }
    @keyframes pmg-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <!-- Écran de chargement PHARMA+ (masqué une fois Flutter initialisé) -->
  <div id="pmg-loading">
    <img class="pmg-logo" src="assets/assets/branding/pharma-logo-full.webp"
         alt="PHARMA+ — Gestion intelligente de votre pharmacie"
         decoding="async" fetchpriority="high"
         onerror="this.style.display='none'">
    <div class="pmg-welcome">Bienvenue</div>
    <div class="pmg-sub">Gestion intelligente de votre pharmacie</div>
    <div class="pmg-progress-row">
      <div class="pmg-track"><div class="pmg-fill" id="pmg-fill"></div></div>
      <div class="pmg-pct" id="pmg-pct">0%</div>
    </div>
    <div class="pmg-loadtext">Chargement en cours...</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=202609192339" async></script>
  <script>
    // ---- Progression RÉELLE de la barre (0 → 100 %) ----
    // La barre avance par paliers tant que Flutter charge ; elle atteint
    // 100 % au premier frame Flutter, puis l'écran est retiré. Ce n'est
    // PAS une image ni une boucle décorative : le pourcentage évolue.
    (function () {
      var fill = document.getElementById('pmg-fill');
      var pct = document.getElementById('pmg-pct');
      var el = document.getElementById('pmg-loading');
      var value = 0;
      var done = false;
      function render(v) {
        value = Math.max(0, Math.min(100, v));
        if (fill) fill.style.width = value + '%';
        if (pct) pct.textContent = Math.round(value) + '%';
      }
      // Paliers : rapide au début, puis ralentit vers ~90 % en attente
      // du premier frame Flutter (la vraie fin de chargement).
      var timer = setInterval(function () {
        if (done) return;
        var step = value < 40 ? 4 : value < 70 ? 2 : value < 90 ? 0.7 : 0;
        if (step > 0) render(value + step);
      }, 120);
      function finish() {
        if (done) return;
        done = true;
        clearInterval(timer);
        render(100);
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 450);
      }
      window.addEventListener('flutter-first-frame', finish);
      // Anti-blocage : jamais plus de 15 s d'écran de chargement.
      setTimeout(finish, 15000);
    })();
  </script>
</body>
</html>
