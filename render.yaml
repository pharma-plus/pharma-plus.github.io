# Render Blueprint — PHARMA MAROC GOLD (backend API)
# Déploiement : dans Render, New > Blueprint > sélectionner le dépôt
# meachbani-tech/pharma-maroc-gold-src. Render crée la base + le service.
# Les variables marquées `sync: false` doivent être renseignées dans le
# tableau de bord Render (ne sont pas stockées dans ce fichier).

databases:
  - name: pharma-maroc-gold-db
    databaseName: pharma_maroc_gold
    user: pharma
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: pharma-maroc-gold-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    branch: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    releaseCommand: npm run db:migrate && npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharma-maroc-gold-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://meachbani-tech.github.io,http://localhost:3000,http://localhost:5000
      - key: SUPER_ADMIN_EMAIL
        value: admin@pharmamarocgold.com
      - key: OTP_ISSUER
        value: Pharma Maroc Gold
      - key: JWT_SECRET
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
