<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="pmg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E0C6"/>
      <stop offset="48%" stop-color="#12A06A"/>
      <stop offset="100%" stop-color="#0A3D2E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Carré de marque arrondi (dégradé vert pharmacie -> turquoise) -->
  <rect x="16" y="16" width="208" height="208" rx="54" ry="54" fill="url(#pmg)"/>
  <rect x="16" y="16" width="208" height="208" rx="54" ry="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Reflet lumineux haut -->
  <rect x="16" y="16" width="208" height="120" rx="54" ry="54" fill="url(#sheen)"/>

  <!-- Croix médicale stylisée (= symbole "+") -->
  <g fill="#FFFFFF">
    <rect x="104" y="52" width="32" height="136" rx="15"/>
    <rect x="52" y="104" width="136" height="32" rx="15"/>
  </g>
  <!-- Liseré turquoise pour la profondeur -->
  <g fill="none" stroke="#00E0C6" stroke-opacity="0.55" stroke-width="3">
    <rect x="104" y="52" width="32" height="136" rx="15"/>
    <rect x="52" y="104" width="136" height="32" rx="15"/>
  </g>

  <!-- Capsule subtile en bas à droite -->
  <g transform="rotate(-45 168 168)">
    <rect x="134" y="155" width="68" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.92"/>
    <rect x="134" y="155" width="34" height="26" rx="13" fill="#00E0C6"/>
  </g>
</svg>
