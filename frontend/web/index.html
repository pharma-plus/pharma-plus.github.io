<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PHARMA+ — Suite de gestion de pharmacie (caisse, stock, ordonnances, parapharmacie, IA).">
  <meta name="theme-color" content="#1B5E20">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PHARMA+">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>PHARMA+ — Gestion de pharmacie</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #082310; }
    #pmg-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(135deg, #0A2A0F 0%, #0E3A1C 50%, #082310 100%);
    }
    #pmg-loading .pmg-mark {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 34px; font-weight: 900; letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 24px rgba(0, 191, 165, 0.55);
    }
    #pmg-loading .pmg-spinner {
      width: 38px; height: 38px; border-radius: 50%;
      border: 4px solid rgba(0, 191, 165, 0.25);
      border-top-color: #00BFA5;
      animation: pmg-spin 0.9s linear infinite;
    }
    @keyframes pmg-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Écran de chargement PHARMA+ (masqué une fois Flutter initialisé) -->
  <div id="pmg-loading">
    <div class="pmg-mark">PHARMA+</div>
    <div class="pmg-spinner"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=73d91f9" async></script>
  <script>
    // Supprime l'écran de chargement dès que le premier frame Flutter est rendu.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('pmg-loading');
      if (el) el.parentNode && el.parentNode.removeChild(el);
    });
    // Sécurité anti-blocage : retire le loader au bout de 15 s quoi qu'il
    // arrive, afin qu'il ne puisse jamais masquer l'application.
    setTimeout(function () {
      var el = document.getElementById('pmg-loading');
      if (el) el.parentNode && el.parentNode.removeChild(el);
    }, 15000);
  </script>
</body>
</html>
