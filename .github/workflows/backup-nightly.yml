name: backup-nightly

# Sauvegarde quotidienne PHARMA+ (worker pg_dump chiffré).
# Secrets requis (dégradé propre si absents — les étapes sont ignorées) :
#   BACKUP_DATABASE_URL, BACKUP_ENCRYPTION_KEY,
#   BACKUP_SUPER_ADMIN_EMAIL, BACKUP_SUPER_ADMIN_PASSWORD
on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC = 05:30 Maroc
  workflow_dispatch: {}

# Permissions minimales : lecture seule du dépôt (sauvegarde via API Supabase).
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets disponibles ?
        id: cfg
        env:
          HAS_DB: ${{ secrets.BACKUP_DATABASE_URL != '' }}
          HAS_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY != '' }}
        run: |
          echo "has_db=$HAS_DB" >> "$GITHUB_OUTPUT"
          echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Outils PostgreSQL
        if: steps.cfg.outputs.has_db == 'true' && steps.cfg.outputs.has_key == 'true'
        run: |
          # Client PG 17 (serveur Supabase = 17.x) — le client apt 16 refuse
          # le dump sur mismatch de version ("server version: 17.6").
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.has_db == 'true' && steps.cfg.outputs.has_key == 'true'
        with:
          node-version: 20

      - name: Dépendances minimales (pg + dotenv)
        if: steps.cfg.outputs.has_db == 'true' && steps.cfg.outputs.has_key == 'true'
        working-directory: backend
        run: npm install pg dotenv --no-save --no-audit --no-fund

      - name: Sauvegarde + vérification
        if: steps.cfg.outputs.has_db == 'true' && steps.cfg.outputs.has_key == 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SUPER_ADMIN_EMAIL: ${{ secrets.BACKUP_SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.BACKUP_SUPER_ADMIN_PASSWORD }}
          PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          node scripts/backup_worker.mjs --create
          node scripts/backup_worker.mjs --verify

      - name: Secrets manquants (information)
        if: steps.cfg.outputs.has_db != 'true' || steps.cfg.outputs.has_key != 'true'
        run: echo "::notice::Secrets BACKUP_* absents — sauvegarde ignorée ce tour."
