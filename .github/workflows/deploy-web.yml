name: Deploy Flutter Web

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Flutter Web — build + deploy to GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Flutter Web (release)
        run: flutter build web --release --no-wasm-dry-run

      - name: Stamp build (Service Worker + bootstrap uniques par build)
        # Sans cette empreinte, flutter_service_worker.js est identique à
        # chaque build : le navigateur mobile ne voit jamais « nouvelle
        # version » et conserve l'ancien cache d'assets (vieilles
        # illustrations). L'empreinte force la mise à jour → purge → rechargement.
        run: |
          cd frontend/build/web
          SHA="$(git rev-parse --short HEAD)"
          sed -i "s/__PMG_BUILD_STAMP__/$SHA/g" flutter_service_worker.js index.html
          grep -q "$SHA" flutter_service_worker.js && echo "SW stamp OK: $SHA"
          grep -q "$SHA" index.html && echo "Bootstrap stamp OK: $SHA"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web
          commit_message: "BUILD ${{ github.run_number }} deploy — ${{ github.event.head_commit.message }}"
