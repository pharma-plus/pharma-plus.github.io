name: Deploy Flutter Web

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Flutter Web — build + deploy to GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos || true

      - name: Run tests
        run: flutter test --no-pub || true

      - name: Build Flutter Web (release)
        # Le numéro de build GitHub (unique et croissant) est injecté dans
        # l'URL bootstrap pour forcer le rechargement des assets sur mobile.
        run: flutter build web --release --no-wasm-dry-run --web-define=PMG_BUILD_NUMBER=${{ github.run_number }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web
          commit_message: "BUILD ${{ github.run_number }} deploy — ${{ github.event.head_commit.message }}"
