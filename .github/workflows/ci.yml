# =============================================================================
# CI — Tests bloquants (mission finalisation PHARMA+)
# Aucun secret requis : tests unitaires autonomes, deno check pur,
# flutter analyze/test sur runner public.
# Lint (eslint) volontairement absent : eslint n'est pas installé
# (constat préexistant, pas de config) — voir rapport final.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissions minimales : lecture seule du dépôt (aucune écriture requise).
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend — tests Node (bloquant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valeurs factices de test (aucun secret réel) : les modules src exigent
      # la présence de ces variables ; .env non versionné, donc fournie ici.
      JWT_SECRET: ci-dummy-jwt-secret-for-tests-only
      BACKUP_ENCRYPTION_KEY: ci-dummy-backup-key-for-tests-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installation dépendances (reproductible)
        run: npm ci --no-audit --no-fund
      - name: Tests unitaires + contrat (node --test)
        run: npm test

  edge-check:
    name: Edge — deno check (bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5 (node24)
        with:
          deno-version: v2.x
      - name: Vérification TypeScript Edge
        run: deno check supabase/functions/pharma-api/index.ts

  flutter-tests:
    name: Flutter — analyze + tests (bloquant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (node24)
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 (composite, owner User)
        with:
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-pub
      - name: Tests Flutter
        run: flutter test --no-pub
