# =============================================================================
# CI — Tests bloquants (mission finalisation PHARMA+)
# Aucun secret requis : tests unitaires autonomes, deno check pur,
# flutter analyze/test sur runner public.
# Lint (eslint) volontairement absent : eslint n'est pas installé
# (constat préexistant, pas de config) — voir rapport final.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend — tests Node (bloquant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installation dépendances (reproductible)
        run: npm ci --no-audit --no-fund
      - name: Tests unitaires + contrat (node --test)
        run: npm test

  edge-check:
    name: Edge — deno check (bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Vérification TypeScript Edge
        run: deno check supabase/functions/pharma-api/index.ts

  flutter-tests:
    name: Flutter — analyze + tests (bloquant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-pub
      - name: Tests Flutter
        run: flutter test --no-pub
